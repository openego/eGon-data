schema:
  fields:
  - name: load_id
    description: Unique name
    type: int
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (required)
  - name: bus
    description: Name of bus to which load is attached.
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (required)
  - name: carrier
    description: 'Energy carrier: can be "AC" or "DC" for electrical buses, or "heat"
      or "gas".'
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: type
    description: Placeholder for load type. Not yet implemented.
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: p_set
    description: Active power consumption (positive if the load is consuming power).
    type: static or series
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: 0.0
    status: Input (optional)
  - name: q_set
    description: Reactive power consumption (positive if the load is inductive).
    type: static or series
    nullable: true
    unit: MVar
    isAbout: []
    valueReference: []
    default: 0.0
    status: Input (optional)
  - name: sign
    description: power sign (opposite sign to generator)
    type: float
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: -1.0
    status: Input (optional)
  - name: scn_name
    description: Name of the eGon scenario
    type: string
    nullable: true
    unit: n/a
    isAbout: []
    valueReference: []
    default: n/a
    status: Input
  primaryKey:
  - scn_name
  - load_id
  foreignKeys: []

  authors: []
  description: ENTSOs’ TYNDP 2020 Scenario Report describes possible European energy
    futures up to 2050. Scenarios are not forecasts; they set out a range of possible
    futures used by the ENTSOs to test future electricity and gas infrastructure needs
    and projects. The scenarios are ambitious as they deliver a low carbon energy
    system for Europe by 2050. The ENTSOs have developed credible scenarios that are
    guided by technically sound pathways, while reflecting country by country specifics,
    so that a pan-European low carbon future is achieved.

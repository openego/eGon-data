type: Table
format: PostgreSQL
encoding: UTF-8
schema:
  fields:
  - name: scn_name
    description: Name of the eGon scenario
    type: character varying
    nullable: false
    unit: n/a
    isAbout: []
    valueReference: []
    default: n/a
    status: Input
  - name: storage_id
    description: Unique name
    type: bigint
    nullable: false
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (required)
  - name: bus
    description: Name of bus to which storage unit is attached.
    type: bigint
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (required)
  - name: control
    description: P,Q,V control strategy for PF, must be "PQ", "PV" or "Slack".
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: PQ
    status: Input (optional)
  - name: type
    description: Placeholder for storage unit type. Not yet implemented.
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: carrier
    description: Prime mover energy carrier (e.g. coal, gas, wind, solar); required
      for global constraints on primary energy in OPF
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: p_nom
    description: Nominal power for limits in OPF.
    type: double precision
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: p_nom_extendable
    description: Switch to allow capacity p_nom to be extended in OPF.
    type: boolean
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: 'False'
    status: Input (optional)
  - name: p_nom_min
    description: If p_nom is extendable in OPF, set its minimum value.
    type: double precision
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: p_nom_max
    description: If p_nom is extendable in OPF, set its maximum value (e.g. limited
      by potential).
    type: double precision
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: inf
    status: Input (optional)
  - name: p_min_pu
    description: The minimum output for each snapshot per unit of p_nom for the OPF
      (negative sign implies storing mode withdrawing power from bus).
    type: double precision
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: '-1'
    status: Input (optional)
  - name: p_max_pu
    description: The maximum output for each snapshot per unit of p_nom for the OPF.
    type: double precision
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: p_set
    description: active power set point (for PF)
    type: double precision
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: q_set
    description: reactive power set point (for PF)
    type: double precision
    nullable: true
    unit: MVar
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: sign
    description: power sign
    type: double precision
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: marginal_cost
    description: Marginal cost of production of 1 MWh.
    type: double precision
    nullable: true
    unit: currency/MWh
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: capital_cost
    description: Capital cost of extending p_nom by 1 MW.
    type: double precision
    nullable: true
    unit: currency/MW
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: build_year
    description: build year
    type: bigint
    nullable: true
    unit: year
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: lifetime
    description: lifetime
    type: double precision
    nullable: true
    unit: years
    isAbout: []
    valueReference: []
    default: inf
    status: Input (optional)
  - name: state_of_charge_initial
    description: State of charge before the snapshots in the OPF.
    type: double precision
    nullable: true
    unit: MWh
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: cyclic_state_of_charge
    description: 'Switch: if True, then state_of_charge_initial is ignored and the
      initial state of charge is set to the final state of charge for the group of
      snapshots in the OPF (soc[-1] = soc[len(snapshots)-1]).'
    type: boolean
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: 'False'
    status: Input (optional)
  - name: state_of_charge_set
    description: State of charge set points for snapshots in the OPF.
    type: double precision
    nullable: true
    unit: MWh
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: max_hours
    description: Maximum state of charge capacity in terms of hours at full output
      capacity p_nom
    type: double precision
    nullable: true
    unit: hours
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: efficiency_store
    description: Efficiency of storage on the way into the storage.
    type: double precision
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: efficiency_dispatch
    description: Efficiency of storage on the way out of the storage.
    type: double precision
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: standing_loss
    description: Losses per hour to state of charge.
    type: double precision
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: inflow
    description: Inflow to the state of charge, e.g. due to river inflow in hydro
      reservoir.
    type: double precision
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  primaryKey:
  - scn_name
  - storage_id
  foreignKeys: []
dialect:
  delimiter: ''
  decimalSeparator: ''
review:
  path: ''
  badge: ''

- title: Assessment of the regionalised demand response potential in Germany using
    an open source tool and dataset
  authors: []
  description: With the expansion of renewable energies in Germany, imminent grid
    congestion events occur more often. One approach for avoiding curtailment of renewable
    energies is to cover excess feed-in by demand response. As curtailment is often
    a local phenomenon, in this work we determine the regional demand response potential
    for the 401 German administrative districts with a temporal resolution of 15 min,
    including technical, socio-technical and economic restrictions.
  publicationYear: null
  path: https://doi.org/10.1016/j.adapen.2020.100001

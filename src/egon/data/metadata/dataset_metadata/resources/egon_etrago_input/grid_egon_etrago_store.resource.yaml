sources:
- title: Salt structures in Northern Germany
  authors: []
  description: 'The application "Information System Salt Structures" provides information
    about the areal distribution of salt structures (stocks and pillows) in Northern
    Germany. With general structural describing information, such as depth, secondary
    thickness, types of use or state of exploration, queries can be conducted. Contours
    of the salt structures can be displayed at horizontal cross-sections at four different
    depths up to a maximum depth of 2000 m below NN. A data sheet with information
    and further reading is provided for every single salt structure. Taking into account
    the fact that this work was undertaken at a scale for providing an overview and
    not for investigation of single structures, the scale of display is limited to
    a minimum of 1:300.000. This web application is the product of a BMWi-funded research
    project "InSpEE" running from the year 2012 to 2015. The acronym stands for "Information
    system salt structures: planning basis, selection criteria and estimation of the
    potential for the construction of salt caverns for the storage of renewable energies
    (hydrogen and compressed air)".'
  publicationYear: null
  path: https://produktcenter.bgr.de/terraCatalog/DetailResult.do?fileIdentifier=338136ea-261a-4569-a2bf-92999d09bad2
  sourceLicenses:
  - name: geonutzv-de-2013-03-19

- title: ERA5 global reanalysis
  authors: []
  description: ERA5 is the fifth generation ECMWF reanalysis for the global climate
    and weather for the past 4 to 7 decades. Currently data is available from 1950,
    split into Climate Data Store entries for 1950-1978 (preliminary back extension)
    and from 1979 onwards (final release plus timely updates, this page). ERA5 replaces
    the ERA-Interim reanalysis. See the online ERA5 documentation (https://confluence.ecmwf.int/display/CKB/ERA5%3A+data+documentation#ERA5:datadocumentation-Dataupdatefrequency)
    for more information.

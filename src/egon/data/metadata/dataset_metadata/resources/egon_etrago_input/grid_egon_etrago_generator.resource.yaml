schema:
  fields:
  - name: generator_id
    description: Unique name
    type: int
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (required)
  - name: bus
    description: name of bus to which generator is attached
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (required)
  - name: control
    description: P,Q,V control strategy for PF, must be "PQ", "PV" or "Slack".
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: PQ
    status: Input (optional)
  - name: type
    description: Placeholder for generator type. Not yet implemented.
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: p_nom
    description: Nominal power for limits in OPF.
    type: float
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: p_nom_extendable
    description: Switch to allow capacity p_nom to be extended in OPF.
    type: boolean
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: 'False'
    status: Input (optional)
  - name: p_nom_min
    description: If p_nom is extendable in OPF, set its minimum value.
    type: float
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: p_nom_max
    description: If p_nom is extendable in OPF, set its maximum value (e.g. limited
      by technical potential).
    type: float
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: inf
    status: Input (optional)
  - name: p_min_pu
    description: The minimum output for each snapshot per unit of p_nom for the OPF
      (e.g. for variable renewable generators this can change due to weather conditions
      and compulsory feed-in; for conventional generators it represents a minimal
      dispatch). Note that if comittable is False and p_min_pu > 0, this represents
      a must-run condition.
    type: static or series
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: p_max_pu
    description: The maximum output for each snapshot per unit of p_nom for the OPF
      (e.g. for variable renewable generators this can change due to weather conditions;
      for conventional generators it represents a maximum dispatch).
    type: static or series
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: p_set
    description: active power set point (for PF)
    type: static or series
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: q_set
    description: reactive power set point (for PF)
    type: static or series
    nullable: true
    unit: MVar
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: sign
    description: power sign
    type: float
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: carrier
    description: Prime mover energy carrier (e.g. coal, gas, wind, solar); required
      for global constraints on primary energy in OPF
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: marginal_cost
    description: Marginal cost of production of 1 MWh.
    type: static or series
    nullable: true
    unit: currency/MWh
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: build_year
    description: build year
    type: int
    nullable: true
    unit: year
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: lifetime
    description: lifetime
    type: float
    nullable: true
    unit: years
    isAbout: []
    valueReference: []
    default: inf
    status: Input (optional)
  - name: capital_cost
    description: Capital cost of extending p_nom by 1 MW.
    type: float
    nullable: true
    unit: currency/MW
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: efficiency
    description: Ratio between primary energy and electrical energy, e.g. takes value
      0.4 MWh_elec/MWh_thermal for gas. This is required for global constraints on
      primary energy in OPF.
    type: float
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: committable
    description: Use unit commitment (only possible if p_nom is not extendable).
    type: boolean
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: 'False'
    status: Input (optional)
  - name: start_up_cost
    description: Cost to start up the generator. Only read if committable is True.
    type: float
    nullable: true
    unit: currency
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: shut_down_cost
    description: Cost to shut down the generator. Only read if committable is True.
    type: float
    nullable: true
    unit: currency
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: min_up_time
    description: Minimum number of snapshots for status to be 1.  Only read if committable
      is True.
    type: int
    nullable: true
    unit: snapshots
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: min_down_time
    description: Minimum number of snapshots for status to be 0.  Only read if committable
      is True.
    type: int
    nullable: true
    unit: snapshots
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: up_time_before
    description: Number of snapshots that the generator was online before network.snapshots
      start. Only read if committable is True and min_up_time is non-zero.
    type: int
    nullable: true
    unit: snapshots
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: down_time_before
    description: Number of snapshots that the generator was online before network.snapshots
      start. Only read if committable is True and min_down_time is non-zero.
    type: int
    nullable: true
    unit: snapshots
    isAbout: []
    valueReference: []
    default: '0'
    status: Input (optional)
  - name: ramp_limit_up
    description: Maximum active power increase from one snapshot to the next, per
      unit of the nominal power. Ignored if NaN.
    type: float
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: ramp_limit_down
    description: Maximum active power decrease from one snapshot to the next, per
      unit of the nominal power. Ignored if NaN.
    type: float
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: ramp_limit_start_up
    description: Maximum active power increase at start up, per unit of the nominal
      power.   Only read if committable is True.
    type: float
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: ramp_limit_shut_down
    description: Maximum active power decrease at shut down, per unit of the nominal
      power.   Only read if committable is True.
    type: float
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    default: '1'
    status: Input (optional)
  - name: scn_name
    description: Name of the eGon scenario
    type: string
    nullable: true
    unit: n/a
    isAbout: []
    valueReference: []
    default: n/a
    status: Input
  primaryKey:
  - scn_name
  - generator_id
  foreignKeys: []
dialect:
  delimiter: ''
  decimalSeparator: ''
review:
  path: ''
  badge: ''

'@id': ''
name: boundaries.egon_map_zensus_grid_districts
topics: []
title: eGon - Mapping of Zensus 2011 cells to MV grid districts
path: WILL_BE_SET_AT_PUBLICATION
description: Assigns each 100 m × 100 m (1 ha) Zensus 2011 grid cell of society.destatis_zensus_population_per_ha
  to the medium-voltage (MV) grid district of grid.egon_mv_grid_district its centroid
  lies in (spatial join of the cell centroid geom_point with the district polygons,
  EPSG:3035). Cells whose centroid lies in no grid district are not included.

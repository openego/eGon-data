schema:
  primaryKey:
  - scn_name
  - load_id
  foreignKeys: []
  fields:
  - name: scn_name
    description: Scenario name (status2024, reGon2037 or reGon2045); only scenarios
      configured in the run are written
    type: string
    unit: none
  - name: load_id
    description: eTraGo load id; together with scn_name it identifies the load in
      grid.egon_etrago_load and grid.egon_etrago_load_timeseries
    type: integer
    unit: none
  - name: carrier
    description: 'Traction system: rail_traction (16.7-Hz main line), rail_sbahn_dc
      (DC S-Bahn) or rail_transit_dc (DC tram/U-Bahn)'
    type: string
    unit: none
  - name: place
    description: Converter site name (method converter) or city whose DC energy the
      point carries (methods dc_rectifier, dc_centroid)
    type: string
    unit: none
  - name: method
    description: 'How the point was located: converter (curated 16.7-Hz converter
      station from the data bundle), dc_rectifier (DC rectifier substation classified
      from OpenStreetMap, within 25 km of the city centroid; the city''s energy is
      split equally over these) or dc_centroid (no rectifier mapped, load at the city
      centroid)'
    type: string
    unit: none
  - name: bus_id
    description: eTraGo bus the load is attached to (grid.egon_etrago_bus.bus_id)
    type: integer
    unit: none
  - name: bus_level
    description: 'Polygon layer the bus was taken from: ehv (EHV substation Voronoi
      cell, for EHV/HV coupling) or mv (MV grid district, for MV coupling)'
    type: string
    unit: none
  - name: bus_method
    description: 'How the bus was found: within (point lies in the polygon) or nearest
      (nearest-neighbour fallback for points outside every polygon)'
    type: string
    unit: none
  - name: energy_mwh_a
    description: Annual electricity drawn from the 50-Hz grid at this point in this
      scenario (base-year energy times the scenario factor, rounded to 4 decimals)
    type: number
    unit: MWh
  - name: geom
    description: 'Location of the coupling point (CRS: ETRS89 / EPSG:3035)'
    type: string
    unit: none

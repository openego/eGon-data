name: grid.egon_rail_transport_load_points
topics: []
title: eGon rail and public transport electricity demand load points
path: WILL_BE_SET_AT_PUBLICATION
description: 'Coupling points at which electrified rail and urban public transport
  draw electricity from the public 50-Hz grid, one row per load written to grid.egon_etrago_load
  by the RailTransitDemand dataset (joinable on scn_name and load_id). Three traction
  systems are covered as eTraGo carriers: 16.7-Hz main-line traction (rail_traction)
  at the 19 frequency converter stations that feed the 16.7-Hz rail grid (EHV/HV),
  and DC S-Bahn (rail_sbahn_dc) and DC tram/U-Bahn (rail_transit_dc) at rectifier
  substations (MV). Converter locations and their annual energy come from a curated
  list in the eGon data bundle; DC rectifiers are classified from eGon''s OpenStreetMap
  tables by their frequency and voltage tags, and each city''s DC energy per system
  is split equally over the rectifiers within 25 km of the city centroid, or placed
  at the centroid if no rectifier is mapped. Each point is assigned to the bus of
  the EHV substation Voronoi cell (EHV/HV coupling) or the MV grid district (MV coupling)
  it lies in, with a nearest-neighbour fallback. The energy is the 50-Hz draw (status2024:
  7.0 TWh traction, 0.56 TWh S-Bahn, 2.1837 TWh tram/U-Bahn), i.e. without the ~3.4
  TWh generated inside the 16.7-Hz rail grid; reGon2037 and reGon2045 scale it uniformly
  by 1.135714 and 1.207143, the ratio of the NEP 2037/2045 (V2025, 2nd draft) transport
  demand figures. Rows exist only for the scenarios configured in the run. Hourly
  profiles are not stored here but in grid.egon_etrago_load_timeseries.'

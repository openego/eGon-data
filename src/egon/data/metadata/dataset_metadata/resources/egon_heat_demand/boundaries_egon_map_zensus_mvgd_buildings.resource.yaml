name: boundaries.egon_map_zensus_mvgd_buildings
title: eGon buildings mapping table
path: WILL_BE_SET_AT_PUBLICATION
description: Mapping table for all used buildings via project internal building_id.
  Additional info about if it is a synthetic or a openstreetmap building, where it
  is located (census cell_id, mvgd_id), in which sector (residential, cts) the building
  is used, if there are heat or electricity profiles.

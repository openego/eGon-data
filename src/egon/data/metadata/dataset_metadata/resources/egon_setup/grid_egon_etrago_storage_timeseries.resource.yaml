schema:
  fields:
  - name: ''
    description: The minimum output for each snapshot per unit of p_nom for the OPF
      (negative sign implies storing mode withdrawing power from bus).
    type: static or series
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    attribute: p_min_pu
    default: '-1'
    status: Input (optional)
  - name: ''
    description: The maximum output for each snapshot per unit of p_nom for the OPF.
    type: static or series
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    attribute: p_max_pu
    default: '1'
    status: Input (optional)
  - name: ''
    description: active power set point (for PF)
    type: static or series
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    attribute: p_set
    default: '0'
    status: Input (optional)
  - name: ''
    description: reactive power set point (for PF)
    type: static or series
    nullable: true
    unit: MVar
    isAbout: []
    valueReference: []
    attribute: q_set
    default: '0'
    status: Input (optional)
  - name: ''
    description: Marginal cost of production of 1 MWh.
    type: static or series
    nullable: true
    unit: currency/MWh
    isAbout: []
    valueReference: []
    attribute: marginal_cost
    default: '0'
    status: Input (optional)
  - name: ''
    description: State of charge set points for snapshots in the OPF.
    type: static or series
    nullable: true
    unit: MWh
    isAbout: []
    valueReference: []
    attribute: state_of_charge_set
    default: n/a
    status: Input (optional)
  - name: ''
    description: Inflow to the state of charge, e.g. due to river inflow in hydro
      reservoir.
    type: static or series
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    attribute: inflow
    default: '0'
    status: Input (optional)
  - name: ''
    description: Unique identifyier of temporal index
    type: integer
    nullable: true
    unit: n/a
    isAbout: []
    valueReference: []
    attribute: temp_id
    default: n/a
    status: Input
  - name: ''
    description: null
    type: int
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: storage_id
    default: n/a
    status: null
  - name: ''
    description: Name of the eGon scenario
    type: string
    nullable: true
    unit: n/a
    isAbout: []
    valueReference: []
    attribute: scn_name
    default: n/a
    status: Input
  primaryKey:
  - scn_name
  - storage_id
  foreignKeys: []

schema:
  fields:
  - name: carrier_id
    description: Unique name
    type: int
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (required)
  - name: co2_emissions
    description: Emissions in CO2-tonnes-equivalent per MWh of primary energy (e.g.
      methane has 0.2 tonnes_CO2/MWh_thermal).
    type: float
    nullable: true
    unit: tonnes/MWh
    isAbout: []
    valueReference: []
    default: 0.0
    status: Input (optional)
  - name: color
    description: plotting color
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: nice_name
    description: More precise descriptive name
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    default: n/a
    status: Input (optional)
  - name: max_growth
    description: maximum new installed capacity per investment period
    type: float
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    default: .inf
    status: Input (optional)
  - name: scn_name
    description: Name of the eGon scenario
    type: string
    nullable: true
    unit: n/a
    isAbout: []
    valueReference: []
    default: n/a
    status: Input
  primaryKey:
  - scn_name
  - carrier_id
  foreignKeys: []

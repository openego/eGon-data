schema:
  fields:
  - name: ''
    description: Unique name
    type: int
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: storage_id
    default: n/a
    status: Input (required)
  - name: ''
    description: Name of bus to which storage unit is attached.
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: bus
    default: n/a
    status: Input (required)
  - name: ''
    description: P,Q,V control strategy for PF, must be "PQ", "PV" or "Slack".
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: control
    default: PQ
    status: Input (optional)
  - name: ''
    description: Placeholder for storage unit type. Not yet implemented.
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: type
    default: n/a
    status: Input (optional)
  - name: ''
    description: Nominal power for limits in OPF.
    type: float
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    attribute: p_nom
    default: '0'
    status: Input (optional)
  - name: ''
    description: Switch to allow capacity p_nom to be extended in OPF.
    type: boolean
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: p_nom_extendable
    default: 'False'
    status: Input (optional)
  - name: ''
    description: If p_nom is extendable in OPF, set its minimum value.
    type: float
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    attribute: p_nom_min
    default: '0'
    status: Input (optional)
  - name: ''
    description: If p_nom is extendable in OPF, set its maximum value (e.g. limited
      by potential).
    type: float
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    attribute: p_nom_max
    default: inf
    status: Input (optional)
  - name: ''
    description: The minimum output for each snapshot per unit of p_nom for the OPF
      (negative sign implies storing mode withdrawing power from bus).
    type: static or series
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    attribute: p_min_pu
    default: '-1'
    status: Input (optional)
  - name: ''
    description: The maximum output for each snapshot per unit of p_nom for the OPF.
    type: static or series
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    attribute: p_max_pu
    default: '1'
    status: Input (optional)
  - name: ''
    description: active power set point (for PF)
    type: static or series
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    attribute: p_set
    default: '0'
    status: Input (optional)
  - name: ''
    description: reactive power set point (for PF)
    type: static or series
    nullable: true
    unit: MVar
    isAbout: []
    valueReference: []
    attribute: q_set
    default: '0'
    status: Input (optional)
  - name: ''
    description: power sign
    type: float
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: sign
    default: '1'
    status: Input (optional)
  - name: ''
    description: Prime mover energy carrier (e.g. coal, gas, wind, solar); required
      for global constraints on primary energy in OPF
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: carrier
    default: n/a
    status: Input (optional)
  - name: ''
    description: Marginal cost of production of 1 MWh.
    type: static or series
    nullable: true
    unit: currency/MWh
    isAbout: []
    valueReference: []
    attribute: marginal_cost
    default: '0'
    status: Input (optional)
  - name: ''
    description: Capital cost of extending p_nom by 1 MW.
    type: float
    nullable: true
    unit: currency/MW
    isAbout: []
    valueReference: []
    attribute: capital_cost
    default: '0'
    status: Input (optional)
  - name: ''
    description: build year
    type: int
    nullable: true
    unit: year
    isAbout: []
    valueReference: []
    attribute: build_year
    default: '0'
    status: Input (optional)
  - name: ''
    description: lifetime
    type: float
    nullable: true
    unit: years
    isAbout: []
    valueReference: []
    attribute: lifetime
    default: inf
    status: Input (optional)
  - name: ''
    description: State of charge before the snapshots in the OPF.
    type: float
    nullable: true
    unit: MWh
    isAbout: []
    valueReference: []
    attribute: state_of_charge_initial
    default: '0'
    status: Input (optional)
  - name: ''
    description: 'Switch: if True, then state of charge at the beginning of an investment
      period is set to state_of_charge_initial'
    type: boolean
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: state_of_charge_initial_per_period
    default: 'False'
    status: Input (optional)
  - name: ''
    description: State of charge set points for snapshots in the OPF.
    type: static or series
    nullable: true
    unit: MWh
    isAbout: []
    valueReference: []
    attribute: state_of_charge_set
    default: n/a
    status: Input (optional)
  - name: ''
    description: 'Switch: if True, then state_of_charge_initial is ignored and the
      initial state of charge is set to the final state of charge for the group of
      snapshots in the OPF (soc[-1] = soc[len(snapshots)-1]).'
    type: boolean
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: cyclic_state_of_charge
    default: 'False'
    status: Input (optional)
  - name: ''
    description: 'Switch: if True, then the cyclic constraints are applied to each
      period (first snapshot level if multiindexed) separately.'
    type: boolean
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: cyclic_state_of_charge_per_period
    default: 'True'
    status: Input (optional)
  - name: ''
    description: Maximum state of charge capacity in terms of hours at full output
      capacity p_nom
    type: float
    nullable: true
    unit: hours
    isAbout: []
    valueReference: []
    attribute: max_hours
    default: '1'
    status: Input (optional)
  - name: ''
    description: Efficiency of storage on the way into the storage.
    type: float
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    attribute: efficiency_store
    default: '1'
    status: Input (optional)
  - name: ''
    description: Efficiency of storage on the way out of the storage.
    type: float
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    attribute: efficiency_dispatch
    default: '1'
    status: Input (optional)
  - name: ''
    description: Losses per hour to state of charge.
    type: float
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    attribute: standing_loss
    default: '0'
    status: Input (optional)
  - name: ''
    description: Inflow to the state of charge, e.g. due to river inflow in hydro
      reservoir.
    type: static or series
    nullable: true
    unit: MW
    isAbout: []
    valueReference: []
    attribute: inflow
    default: '0'
    status: Input (optional)
  - name: ''
    description: Name of the eGon scenario
    type: string
    nullable: true
    unit: n/a
    isAbout: []
    valueReference: []
    attribute: scn_name
    default: n/a
    status: Input
  primaryKey:
  - scn_name
  - storage_id
  foreignKeys: []
dialect:
  delimiter: ''
  decimalSeparator: ''
review:
  path: ''
  badge: ''

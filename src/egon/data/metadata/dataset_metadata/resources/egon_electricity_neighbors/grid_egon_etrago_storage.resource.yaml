- title: Netzentwicklungsplan Strom 2035, Version 2021, erster Entwurf
  authors: []
  description: Die vier deutschen Übertragungsnetzbetreiber zeigen mit diesem ersten
    Entwurf des Netzentwicklungsplans 2035, Version 2021, den benötigten Netzausbau
    für die nächsten Jahre auf. Der NEP-Bericht beschreibt keine konkreten Trassenverläufe
    von Übertragungsleitungen, sondern er dokumentiert den notwendigen Übertragungsbedarf
    zwischen Netzknoten. Das heißt, es werden Anfangs- und Endpunkte von zukünftigen
    Leitungsverbindungen definiert sowie konkrete Empfehlungen für den Aus- und Neubau
    der Übertragungsnetze an Land und auf See in Deutschland gemäß den Detailanforderungen
    im § 12 EnWG gegeben.

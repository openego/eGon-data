- title: 'Data bundle for egon-data: A transparent and reproducible data processing
    pipeline for energy system modeling'
  authors: []
  description: egon-data provides a transparent and reproducible open data based data
    processing pipeline for generating data models suitable for energy system modeling.
    The data is customized for the requirements of the research project eGon. The
    research project aims to develop tools for an open and cross-sectoral planning
    of transmission and distribution grids. For further information please visit the
    eGon project website or its Github repository.  egon-data retrieves and processes
    data from several different external input sources. As not all data dependencies
    can be downloaded automatically from external sources we provide a data bundle
    to be downloaded by egon-data.

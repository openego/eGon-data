'@id': null
name: demand.iee_household_load_profiles
title: eGon pool of electricity household load profiles
path: WILL_BE_SET_AT_PUBLICATION
description: '100.000 annual profiles in hourly resolution of electricity demand of
  private households for different household types (singles, couples, other) with
  varying number of elderly and children. The profiles were created using a bottom-up
  load profile generator by Fraunhofer IEE developed in the Bachelors thesis "Auswirkungen
  verschiedener Haushaltslastprofile auf PV-Batterie-Systeme" by Jonas Haack, Fachhochschule
  Flensburg, December 2012. The columns are named as follows: "<HH_TYPE_PREFIX>a<PROFILE_ID>",
  e.g. P2a0000 is the first profile of a couples household with 2 children. See publication
  below for the list of prefixes. Values are given in Wh.'

title: ETHOS.BUILDA residential buildings (point dataset)
path: WILL_BE_SET_AT_PUBLICATION
description: 'Alle Wohngebäude Deutschlands als Punkte mit Baujahr, Größenklasse,
  Sanierungsstand und TABULA-Archetyp, importiert aus ETHOS.BUILDA v2.0.0. Rohdatenimport
  ohne fachliche Veränderung: aus den vier JSON-Objektspalten der Quelle wird nur
  das Feld ''value'' ausgepackt, plus die Herkunft (''lineage'') für die zwei Attribute,
  bei denen sie variiert. Grundlage des Verschnitts, der openstreetmap.osm_buildings_residential
  befüllt.'

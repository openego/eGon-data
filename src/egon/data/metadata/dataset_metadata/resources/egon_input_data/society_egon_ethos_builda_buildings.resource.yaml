schema:
  fields:
  - name: id
    description: ETHOS.BUILDA-Gebäudekennung mit NUTS-1-Präfix, z. B. 'DEF_1080931425'.
      Bundesweit eindeutig; kein Gebäude kommt in zwei NUTS-1-Dateien vor (über alle
      19.420.827 Datensätze geprüft).
    type: text
    nullable: false
    unit: none
    isAbout: []
    valueReference: []
  - name: nuts1
    description: NUTS-1-Code der Region (DE1…DEG), beim Laden aus dem id-Präfix abgeleitet.
      Redundant, aber indizierbar — trägt den Testmodusfilter (--dataset-boundary)
      und die Auswertung je Bundesland.
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: geom_point
    description: 'Repräsentativer Punkt des Gebäudes (CRS: ETRS89-LAEA / EPSG:3035).
      Aus der WKT-Spalte ''position'' der Quelle; das CRS ist dort bereits 3035 und
      wird nicht transformiert.'
    type: geometry(Point,3035)
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: construction_year
    description: 'Geschätztes Baujahr. Herkunft je Zeile in construction_year_lineage:
      64,67 % XGBoost-Schätzung, 35,33 % aus Zensus 2011 abgeleitet. Die Dekadenverteilung
      deutet auf Streuung innerhalb der TABULA-Bänder hin, nicht auf Baujahrsschärfe.'
    type: integer
    nullable: true
    unit: a
    isAbout: []
    valueReference: []
  - name: construction_year_lineage
    description: 'Herkunft des Baujahrs: ''ai'' (XGBoost-Modell v4_model.json, 64,67
      %) oder ''der'' (aus Zensus 2011 abgeleitet, 35,33 %).'
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: size_class
    description: 'TABULA-Größenklasse: SFH (Einfamilienhaus), MFH (Mehrfamilienhaus),
      TH (Reihenhaus), AB (Wohnblock).'
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: size_class_lineage
    description: 'Herkunft der Größenklasse: ''der'' (aus Zensus 2011 abgeleitet,
      55,68 %) oder ''ai'' (XGBoost-Modell, 44,32 %).'
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: refurbishment_state
    description: 'Sanierungsstand ''1'' bis ''3''. Herkunft ist konstant und deshalb
      nicht als Spalte geführt: zu 100 % source ''uba_renov'' / lineage ''stat'',
      also Zufallsziehung aus Statistiken auf Bundeslandebene (UBA-Hintergrundbericht
      "Wohnen und Sanieren") — keine gebäudeindividuelle Beobachtung.'
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: tabula_type
    description: TABULA-Archetyp des Gebäudes. Herkunft konstant zu 100 % source 'tabula_de'
      / lineage 'map'; deterministisch aus size_class, construction_year und refurbishment_state
      komponiert und daher redundant zu diesen drei.
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  primaryKey:
  - id
  foreignKeys: []

sources:
- title: 'ETHOS.BUILDA: Residential Building TABULA Archetype Dataset Germany'
  authors:
  - Kristina Dabrock
  - Jens Ulken
  - Noah Pflugradt
  - Jann Michael Weinand
  - Detlef Stolten
  description: Alle Wohngebäude Deutschlands mit Baujahr, Größenklasse, Sanierungsstand
    und TABULA-Archetyp, als Punktdatensatz. Teil-Dump der ETHOS.BUILDA-Datenbank
    (Version v8_20240916), ausgeliefert als 16 CSVs je NUTS-1-Region mit insgesamt
    19.420.827 Datensätzen. Baujahr und Größenklasse werden mit XGBoost-Modellen geschätzt
    (Testgenauigkeit 73,9 % bzw. 97,4 % auf Einzelgebäudeebene); Trainingsdaten überwiegend
    aus dem Zensus-Gitter, angereichert mit morphologischen Gebäude- und Nachbarschaftsmerkmalen
    sowie sozioökonomischen Merkmalen. Sanierungsstände werden nicht modelliert, sondern
    aus Statistiken auf Bundeslandebene zugewiesen.

'@id': null
name: openstreetmap.osm_buildings_residential
title: eGon residential buildings from OpenStreetMap and ETHOS.BUILDA
path: WILL_BE_SET_AT_PUBLICATION
description: 'Wohngebäude Deutschlands, bestimmt durch Verschnitt der OpenStreetMap-Gebäudepolygone
  mit dem Punktdatensatz ETHOS.BUILDA statt durch OSM-Tags allein. Dreistufige Kaskade,
  deren Stufe je Gebäude in der Spalte ''source'' steht: (1) ETHOS-Punkt liegt im
  Polygon, (2) nächster ETHOS-Punkt innerhalb von 10 m, (3) kein ETHOS-Treffer, aber
  ein Wohngebäude-Tag in OSM. Ein Gebäude wird genau einmal und ein ETHOS-Punkt genau
  einmal zugeordnet. Die vier ETHOS-Attribute sind inline durchgereicht; ihre Herkunft
  ist über ethos_id joinbar. Enthält damit auch Gebäude, deren OSM-Tag kein Wohngebäude
  nahelegt.'

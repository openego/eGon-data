schema:
  fields:
  - name: id
    description: Projektinterne, eindeutige Gebäudekennung. Referenziert von demand.egon_building_electricity_peak_loads.building_id,
      demand.egon_building_heat_peak_loads.building_id, demand.egon_household_electricity_profile_of_buildings.building_id,
      boundaries.egon_map_zensus_buildings_residential.id.
    type: integer
    nullable: false
    unit: none
    isAbout: []
    valueReference: []
  - name: osm_id
    description: OpenStreetMap-Kennung des Gebäudes.
    type: bigint
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: amenity
    description: OSM-amenity-Tag, falls gesetzt.
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: building
    description: OSM-building-Tag.
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: name
    description: Name des Gebäudes, falls in OSM gesetzt.
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: geom_building
    description: 'Gebäudepolygon (CRS: ETRS89-LAEA / EPSG:3035).'
    type: geometry
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: area
    description: Grundfläche des Gebäudes.
    type: double precision
    nullable: true
    unit: m^2
    isAbout: []
    valueReference: []
  - name: geom_point
    description: 'Schwerpunkt des Gebäudes (CRS: ETRS89-LAEA / EPSG:3035).'
    type: geometry
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: tags
    description: Vollständige OSM-Tags des Gebäudes.
    type: hstore
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: source
    description: 'Wie das Gebäude als Wohngebäude erkannt wurde. ''ethos_intersect'':
      ein ETHOS-Punkt liegt im Polygon. ''ethos_nearest'': der nächste ETHOS-Punkt
      liegt innerhalb von 10 m des repräsentativen Punktes (ST_PointOnSurface). ''osm_tagging'':
      kein ETHOS-Treffer, aber ein Wohngebäude-Tag in OSM. ''census_gap_fill'': von
      extend_buildings_residential ergänzt für Zensuszellen mit Bevölkerung, aber
      ohne Wohngebäude.'
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: ethos_id
    description: Kennung des zugeordneten ETHOS-Gebäudes; Referenz auf society.egon_ethos_builda_buildings.id.
      NULL bei source 'osm_tagging' und 'census_gap_fill'. Kein Fremdschlüssel-Constraint,
      um die Reihenfolge der Datasets nicht hart zu verdrahten.
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: match_distance
    description: 'Abstand zwischen ETHOS-Punkt und repräsentativem Punkt des Gebäudes:
      0 bei ''ethos_intersect'', der gemessene Abstand bei ''ethos_nearest'', NULL
      sonst. Macht die Matchqualität je Zeile lesbar und erlaubt, die 10-m-Schwelle
      nachträglich zu verschärfen, ohne den Verschnitt neu zu rechnen.'
    type: double precision
    nullable: true
    unit: m
    isAbout: []
    valueReference: []
  - name: construction_year
    description: Geschätztes Baujahr aus ETHOS.BUILDA, durchgereicht. NULL bei source
      'osm_tagging' und 'census_gap_fill'. Herkunft je Zeile über ethos_id in society.egon_ethos_builda_buildings.
    type: integer
    nullable: true
    unit: a
    isAbout: []
    valueReference: []
  - name: size_class
    description: TABULA-Größenklasse aus ETHOS.BUILDA (SFH, MFH, TH, AB), durchgereicht.
      NULL bei source 'osm_tagging' und 'census_gap_fill'.
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: refurbishment_state
    description: Sanierungsstand '1' bis '3' aus ETHOS.BUILDA, durchgereicht. Beruht
      auf einer Zufallsziehung aus Statistiken auf Bundeslandebene, nicht auf einer
      gebäudeindividuellen Beobachtung. NULL bei source 'osm_tagging' und 'census_gap_fill'.
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
  - name: tabula_type
    description: TABULA-Archetyp aus ETHOS.BUILDA, durchgereicht. NULL bei source
      'osm_tagging' und 'census_gap_fill'.
    type: text
    nullable: true
    unit: none
    isAbout: []
    valueReference: []

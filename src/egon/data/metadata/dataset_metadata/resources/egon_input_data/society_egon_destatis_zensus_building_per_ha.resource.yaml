schema:
  primaryKey:
  - id
  foreignKeys: []
  fields:
  - name: id
    description: Serial row identifier (primary key).
    type: integer
    unit: none
  - name: grid_id
    description: Census grid cell identifier of the 100 m grid as in the census CSV (column
      Gitter_ID_100m); joins with society.destatis_zensus_population_per_ha.grid_id.
    type: string
    unit: none
  - name: grid_id_new
    description: Census grid cell identifier in the newer INSPIRE-style notation (column Gitter_ID_100m_neu
      of the census CSV).
    type: string
    unit: none
  - name: attribute
    description: Census attribute (Merkmal) the count refers to, e.g. 'INSGESAMT' for the
      cell total.
    type: string
    unit: none
  - name: characteristics_code
    description: Numeric code of the characteristic value (Ausprägung) within the attribute,
      as in the census CSV.
    type: integer
    unit: none
  - name: characteristics_text
    description: German label of the characteristic value (Ausprägung) as in the census CSV.
    type: string
    unit: none
  - name: quantity
    description: Number of buildings in the cell with this attribute and characteristic (census
      value Anzahl).
    type: integer
    unit: building
  - name: quantity_q
    description: Quality indicator of quantity as delivered by the census (Anzahl_q); several
      eGon-data steps (e.g. the combined table society.egon_destatis_zensus_apartment_building_population_per_ha)
      only use rows with quantity_q < 2.
    type: integer
    unit: none
  - name: zensus_population_id
    description: Census cell id; references society.destatis_zensus_population_per_ha.id (matched
      via grid_id).
    type: integer
    unit: none

name: society.egon_destatis_zensus_building_per_ha
topics: []
title: DESTATIS - Zensus 2011 - Buildings per hectare
path: WILL_BE_SET_AT_PUBLICATION
description: 'Buildings with living space (Gebäude) in Germany from the German census 2011
  (Zensus 2011, reference date 9 May 2011) per 100 m × 100 m (1 ha) census grid cell (ETRS89-LAEA,
  EPSG:3035), in long format: one row per grid cell, attribute and characteristic with its
  count. Attribute ''INSGESAMT'' holds the total number of buildings per cell; other attributes
  break it down by building characteristics. Imported from the census CSV ''Gebäude im 100
  Meter-Gitter''; each row is linked to its cell in society.destatis_zensus_population_per_ha
  via grid_id, and rows of cells with a negative population value there (treated as unpopulated)
  are removed. With a --dataset-boundary other than ''Everything'' only cells inside that
  boundary are kept.'

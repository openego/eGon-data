- title: Pan-European Thermal Atlas, Peta version 5.0.1
  authors: []
  description: 'Modelled Heat Demand distribution (in GJ per hectare grid cell) for
    residential and service heat demands for space heating and hot water for the year
    2015 using HRE4 data and the combined top-down bottom-up approach of HRE4. National
    sector-specific heat demand data, derived by the FORECAST model in HRE4 for residential
    (delivered energy, for space heating and hot water) and service-sector (delivered
    energy, for space heating, hot water and process heat) buildings for the year
    2015, were distributed using modelled, spatial statistics based floor areas in
    100x100m grids and a population grid. For further information please see the documentation
    available on the Heat Roadmap Europe website, in particular D2.3 report: Methodologies
    and assumptions used in the mapping.'
  publicationYear: null
  path: https://s-eenergies-open-data-euf.hub.arcgis.com/search

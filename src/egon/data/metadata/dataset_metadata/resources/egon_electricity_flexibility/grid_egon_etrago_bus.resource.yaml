schema:
  fields:
  - name: ''
    description: Unique name
    type: int
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: bus_id
    default: n/a
    status: Input (required)
  - name: ''
    description: Nominal voltage
    type: float
    nullable: true
    unit: kV
    isAbout: []
    valueReference: []
    attribute: v_nom
    default: '1'
    status: Input (optional)
  - name: ''
    description: Placeholder for bus type. Not yet implemented.
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: type
    default: n/a
    status: Input (optional)
  - name: ''
    description: Position (e.g. longitude); the Spatial Reference System Identifier
      (SRID) is set in network.srid.
    type: float
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: x
    default: '0'
    status: Input (optional)
  - name: ''
    description: Position (e.g. latitude); the Spatial Reference System Identifier
      (SRID) is set in network.srid.
    type: float
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: y
    default: '0'
    status: Input (optional)
  - name: ''
    description: 'Energy carrier: can be "AC" or "DC" for electrical buses, or "heat"
      or "gas".'
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: carrier
    default: AC
    status: Input (optional)
  - name: ''
    description: Unit of the bus’ carrier if the implicitly assumed unit ("MW") is
      inappropriate (e.g. "t/h", "MWh_th/h"). Only descriptive. Does not influence
      any PyPSA functions.
    type: string
    nullable: true
    unit: none
    isAbout: []
    valueReference: []
    attribute: unit
    default: n/a
    status: Input (optional)
  - name: ''
    description: Voltage magnitude set point, per unit of v_nom.
    type: static or series
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    attribute: v_mag_pu_set
    default: '1'
    status: Input (optional)
  - name: ''
    description: Minimum desired voltage, per unit of v_nom. This is a placeholder
      attribute and is not currently used by any PyPSA functions.
    type: float
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    attribute: v_mag_pu_min
    default: '0'
    status: Input (optional)
  - name: ''
    description: Maximum desired voltage, per unit of v_nom.  This is a placeholder
      attribute and is not currently used by any PyPSA functions.
    type: float
    nullable: true
    unit: per unit
    isAbout: []
    valueReference: []
    attribute: v_mag_pu_max
    default: inf
    status: Input (optional)
  - name: ''
    description: Name of the eGon scenario
    type: string
    nullable: true
    unit: n/a
    isAbout: []
    valueReference: []
    attribute: scn_name
    default: n/a
    status: Input
  primaryKey:
  - scn_name
  - bus_id
  foreignKeys: []

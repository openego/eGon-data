- title: 'Informationssystem Salz: Planungsgrundlagen, Auswahlkriterien und Potenzialabschätzung
    für die Errichtung von Salzkavernen zur Speicherung von Erneuerbaren Energien
    (Wasserstoff und Druckluft) – Doppelsalinare und flach lagernde Salzschichten.
    Teilprojekt Bewertungskriterien und Potenzialabschätzung'
  authors: []
  description: 'Shapefiles corresponding to the data provided in figure 7-1 (Donadei,
